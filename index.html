<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oleg Kuznetsov</title>
    <meta name="theme-color" content="#0c0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=9" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <p class="logo">Oleg Kuznetsov</p>
        <div class="header__actions">
          <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Música">
            ♪
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="board">
        <figure class="place place-cinema">
          <img src="img/cinema.png" alt="Absolute cinema" />
        </figure>
        <figure class="place place-carrera">
          <img src="img/carrera.png" alt="De ingeniero a desempleado" />
        </figure>
        <figure class="place place-oficios">
          <img src="img/oficios.png" alt="Artistas y programadores" />
        </figure>
        <figure class="place place-error">
          <img src="img/error42.jpg" alt="Error en la línea 42" />
        </figure>
        <figure class="place place-nyan">
          <img src="img/nyan.png" alt="Nyan Cat" />
        </figure>
        <figure class="place place-gato">
          <img src="img/gato.png" alt="Gato en la carretera" />
        </figure>
        <figure class="place place-ardilla">
          <img src="img/ardilla.png" alt="Ardilla saludando" />
        </figure>
        <figure class="place place-continua">
          <img src="img/continua.png" alt="To be continued" />
        </figure>
        <figure class="place place-qr">
          <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
            <img src="img/qr-meme.png" width="679" height="684" alt="Código para consultar más información" />
          </a>
          <figcaption>Más información</figcaption>
        </figure>
      </section>
    </main>

    <div id="cantina" class="cantina"></div>

    <script>
      var player = null;
      var sound = document.getElementById("sound");

      function playCantina() {
        if (!player || !player.playVideo) return;
        player.unMute();
        player.setVolume(45);
        player.playVideo();
      }

      function toggleCantina() {
        if (!player || !player.getPlayerState) return;
        var playing = player.getPlayerState() === 1 && !player.isMuted();
        if (playing) {
          player.pauseVideo();
          sound.setAttribute("aria-pressed", "false");
          return;
        }
        playCantina();
      }

      sound.addEventListener("click", function (event) {
        event.stopPropagation();
        toggleCantina();
      });

      document.addEventListener(
        "pointerdown",
        function () {
          playCantina();
        },
        { once: true }
      );

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("cantina", {
          videoId: "EsvfptdFXf4",
          playerVars: {
            autoplay: 1,
            loop: 1,
            playlist: "EsvfptdFXf4",
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
          },
          events: {
            onReady: function (event) {
              event.target.mute();
              event.target.setVolume(45);
              event.target.playVideo();
            },
            onStateChange: function (event) {
              var audible = event.data === 1 && !player.isMuted();
              sound.setAttribute("aria-pressed", audible ? "true" : "false");
              if (event.data === 0) event.target.playVideo();
            },
          },
        });
      };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
